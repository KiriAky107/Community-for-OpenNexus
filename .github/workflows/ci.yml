name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: community-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: console
      - run: pnpm test && pnpm build
        working-directory: console
      - name: Verify committed web assets match their source
        run: git diff --exit-code -- community/static
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the fixed release tools
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/OpenNexus
          ref: 276b449c27c079474c9d978fe633ff28b53b1c7b
          path: .build/release-tools
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read the fixed Desktop catalog and experiment template contracts
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/OpenNexus
          ref: 8a5a6ada94de4d4071e3a500e33ca1c59cae9399
          path: .contract-desktop
          persist-credentials: false
          sparse-checkout: |
            frontend/src/services/fixtures/community-v1-catalog.json
            frontend/src/services/fixtures/community-v1-templates.json
            frontend/src/services/fixtures/community-v1-configurations.json
            backend/app/services/catalog_configuration_manifest.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.9.24'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Verify the shared contract and local documentation policy
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import subprocess
          desktop = Path('.contract-desktop')
          for name in ('community-v1-catalog.json', 'community-v1-templates.json', 'community-v1-configurations.json'):
              assert (Path('tests/fixtures') / name).read_bytes() == (desktop / 'frontend/src/services/fixtures' / name).read_bytes(), f'Community and Desktop contract differs: {name}'
          assert Path('community/configurations.py').read_bytes() == (desktop / 'backend/app/services/catalog_configuration_manifest.py').read_bytes(), 'Community and Core configuration validators differ'
          private = ('docs/', 'documents/', 'frontend/docs/', '.local-plans/')
          for repo in (Path('.'), desktop):
              paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=repo).decode('utf-8').split('\0')
              assert not any(path.casefold().startswith(private) for path in paths), 'Private documentation must stay local'
          PY
      - run: uv run --frozen python -m compileall -q community
      - name: Test queries, CLI HTTP, WAL backup recovery and deployment smoke
        run: uv run --frozen pytest -q --junitxml=.build/catalog-tests.xml
      - name: Verify the fixed deployment ZIP through its actual CLI and HTTP entrypoint
        run: uv run --frozen python .build/release-tools/scripts/build_service_release.py --kind community --commit "$GITHUB_SHA" --output .build/service-release
      - name: Preserve the deployment archive and its exact verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-deploy-${{ matrix.python }}-${{ github.sha }}
          path: |
            .build/service-release/*_deploy.zip
            .build/service-release/verification.json
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: community-tests-${{ matrix.python }}-${{ github.sha }}
          path: .build/catalog-tests.xml
          if-no-files-found: error
